<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Bolão da Copa do Mundo{% endblock %}</title>

  {#
    Tailwind via Play CDN — funciona sem build, ótimo para dev.
    Para PRODUÇÃO, compile o CSS (ver README) e troque por:
      <link rel="stylesheet" href="/static/css/output.css" />
  #}
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#eef2ff", 100: "#e0e7ff", 200: "#c7d2fe",
              500: "#6366f1", 600: "#4f46e5", 700: "#4338ca", 900: "#312e81",
            },
          },
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/css/output.css" />
  <style>
    [x-cloak]{display:none}
    .fade-in{animation:fade .35s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  </style>
</head>
<body class="h-full bg-slate-50 font-sans text-slate-800 antialiased">
  {% if usuario %}
    {% include "partials/navbar.html" %}
  {% endif %}

  <main class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
