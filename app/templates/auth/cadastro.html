{% extends "base.html" %}
{% block title %}Criar conta · Bolão da Copa do Mundo{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center fade-in">
  <div class="mb-8 text-center">
    <div class="mb-2 text-5xl">🏆</div>
    <h1 class="text-3xl font-extrabold text-slate-900">Criar conta</h1>
    <p class="mt-1 text-sm text-slate-500">Junte-se ao Bolão da Copa do Mundo.</p>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    {% for e in erros %}
      <div class="mb-4 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">{{ e }}</div>
    {% endfor %}

    <form method="post" action="/cadastro" class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Nome</label>
        <input type="text" name="nome" required value="{{ nome or '' }}"
               class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-200" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
        <input type="email" name="email" required value="{{ email or '' }}"
               class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-200" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Senha</label>
        <input type="password" name="senha" required minlength="6"
               class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-200" />
        <p class="mt-1 text-xs text-slate-400">Mínimo de 6 caracteres.</p>
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-700">
        Criar conta
      </button>
    </form>
  </div>

  <p class="mt-6 text-center text-sm text-slate-500">
    Já tem conta?
    <a href="/login" class="font-semibold text-brand-600 hover:text-brand-700">Entrar</a>
  </p>
</div>
{% endblock %}
