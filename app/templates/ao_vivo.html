{% extends "base.html" %}
{% block title %}Ao Vivo · Bolão da Copa do Mundo Arianjo{% endblock %}

{% block content %}
<div class="fade-in space-y-8">
  <header>
    <h1 class="flex items-center gap-2 text-2xl font-extrabold text-slate-900">
      <span class="relative flex h-3 w-3">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-rose-400 opacity-75"></span>
        <span class="relative inline-flex h-3 w-3 rounded-full bg-rose-500"></span>
      </span>
      Ao Vivo
    </h1>
    <p class="text-sm text-slate-500">
      Pontuação provisória — atualiza sozinha
      <span id="ao-vivo-status" class="text-slate-400"></span>
    </p>
  </header>

  <!-- Conteúdo dinâmico (atualizado via fetch, sem recarregar a página) -->
  <div id="ao-vivo-conteudo">
    {% include "partials/ao_vivo_conteudo.html" %}
  </div>
</div>
{% endblock %}

{% block scripts %}
<style>
  /* Piscadinha rápida no selo a cada atualização (prova visual de que atualizou). */
  @keyframes flashAtualizado { from { opacity: .2; } to { opacity: 1; } }
  #ao-vivo-status.flash { animation: flashAtualizado .5s ease; }
</style>
<script>
  // Atualização suave: busca só o conteúdo e troca no lugar, sem piscar a
  // página nem perder o scroll. Cada cliente faz polling e converge para o
  // mesmo placar (sincronização de estado entre clientes).
  var statusEl = document.getElementById("ao-vivo-status");

  function marcarAtualizado() {
    if (!statusEl) return;
    var hora = new Date().toLocaleTimeString("pt-BR"); // HH:MM:SS — muda a cada ciclo
    statusEl.textContent = "· atualizado às " + hora;
    // Re-dispara a animação de "piscar".
    statusEl.classList.remove("flash");
    void statusEl.offsetWidth;
    statusEl.classList.add("flash");
  }

  async function atualizarAoVivo() {
    try {
      var resp = await fetch("/ao-vivo/fragmento", {
        headers: { "X-Requested-With": "fetch" },
        cache: "no-store",
      });
      if (resp.ok) {
        document.getElementById("ao-vivo-conteudo").innerHTML = await resp.text();
        marcarAtualizado();
      }
    } catch (e) {
      /* offline momentâneo — tenta de novo no próximo ciclo */
    }
  }

  marcarAtualizado();            // carimba a hora do carregamento inicial
  setInterval(atualizarAoVivo, 8000);
</script>
{% endblock %}
